<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificat d’étalonnage — MetroCert</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bandeau" id="fictif" hidden>Document fictif : données de démonstration, sans valeur de certificat réel</div>
<div class="ruler" aria-hidden="true"></div>
<main id="cert"><p>Chargement…</p></main>
<script src="/lib/rendu.js"></script>
<script>
(async () => {
  const n = new URLSearchParams(location.search).get('n');
  const main = document.getElementById('cert');
  const rep = await fetch('/api/certificats/' + encodeURIComponent(n || ''));
  if (!rep.ok) { main.innerHTML = '<p class="err">Certificat introuvable. <a href="/">Retour au formulaire</a></p>'; return; }
  const c = await rep.json();
  document.title = 'Certificat ' + c.numero;
  document.getElementById('fictif').hidden = !c.fictif;
  main.innerHTML = Rendu.rendreCertificat(c) +
    '<section class="panel noprint"><h2>Contrôle par l’agent</h2>' +
    '<p>Aide à la relecture — ne remplace pas la signature du responsable technique</p>' +
    '<button type="button" id="controler">Contrôler avec l’agent MetroCert</button>' +
    '<div id="resultat" role="status" style="margin-top:12px;white-space:pre-wrap"></div></section>' +
    '<div class="actions noprint"><button onclick="print()">Imprimer</button><a class="btn sec" href="/">Nouveau certificat</a></div>';
  const btn = document.getElementById('controler');
  const res = document.getElementById('resultat');
  btn.onclick = async () => {
    btn.disabled = true;
    res.style.cssText = 'margin-top:12px;white-space:pre-wrap';
    res.textContent = 'Contrôle en cours… (jusqu’à 30 s)';
    try {
      const r = await fetch('/api/controle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ numero: c.numero }) });
      const d = await r.json();
      if (d.rapport) { res.textContent = d.rapport; res.style.cssText += ';background:#fff;border:1px solid var(--line);padding:12px'; }
      else if (d.message) { res.textContent = d.message; res.style.cssText += ';color:var(--signal);font-weight:600'; }
      else { res.textContent = d.erreur || 'Erreur.'; res.style.cssText += ';color:#B00020;font-weight:600'; }
    } catch (e) {
      res.textContent = 'Service temporairement indisponible.'; res.style.cssText += ';color:#B00020;font-weight:600';
    }
    btn.disabled = false;
  };
})();
</script>
</body>
</html>
